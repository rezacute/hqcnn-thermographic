  - scikit-learn
  - matplotlib
  - seaborn
  - pillow
  - opencv-python
  - pytorch
  - torchvision
  - tqdm
  - pyyaml
  - rich
  - click
  - typer
  - fastapi
  - uvicorn
  - pydantic
  - python-multipart
  - jinja2
